    />
    <script>
      (function () {
        try {
          var s = localStorage.getItem('keepit-theme');
          var t = s === 'dark' || s === 'light' ? s : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
